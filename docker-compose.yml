services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: testwise
      POSTGRES_PASSWORD: testwise
      POSTGRES_DB: testwise
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
  # Live proctoring video/voice (WebRTC SFU). Dev mode uses key "devkey" / secret "secret".
  livekit:
    image: livekit/livekit-server:v1.9
    command: ["--dev", "--bind", "0.0.0.0"]
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
volumes:
  pgdata:
  redisdata:
